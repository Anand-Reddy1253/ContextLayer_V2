[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "context-fabric"
version = "0.1.0"
description = "Context graph over org structure, connector-sourced technical assets, and human-authored logical bindings — served as search and MCP."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }

dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0.36",
  "psycopg[binary,pool]>=3.2",
  "alembic>=1.14",
  "mcp>=1.1",
  "typer>=0.13",
  "structlog>=25.5",
  "httpx>=0.27",
  "aiosqlite>=0.20",
  "tenacity>=9.0",
  "pyyaml>=6.0",
  "cryptography>=43.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "respx>=0.21",
  "ruff>=0.7",
  "mypy>=1.13",
  "types-PyYAML",
]

[project.scripts]
context-fabric = "context_fabric.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/context_fabric"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
# B008: FastAPI's Depends()-in-default-argument is the documented,
# correct idiom (FastAPI evaluates it per-request, not once at import
# time) — not the footgun this rule guards against for mutable defaults.
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
strict_optional = true
disallow_untyped_defs = false
ignore_missing_imports = true
