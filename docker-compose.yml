services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: context_fabric
      POSTGRES_PASSWORD: context_fabric
      POSTGRES_DB: context_fabric
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U context_fabric -d context_fabric"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      CF_DATABASE_URL: postgresql+psycopg://context_fabric:context_fabric@postgres:5432/context_fabric
    ports:
      - "8000:8000" # REST API
      - "8100:8100" # Context MCP (streamable-HTTP)
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./configs:/app/configs
      - ./fixtures:/app/fixtures
      - ./migrations:/app/migrations

  # Runs the UI dev server inside a container so a host Node install is not
  # required. Not part of the production image — see docs/UI.md for the
  # production build (static bundle served by the api image).
  ui:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    volumes:
      - ./ui:/app
      - ui_node_modules:/app/node_modules

volumes:
  pgdata:
  ui_node_modules:
